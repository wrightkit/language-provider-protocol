name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify tag and workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | \
            python3 -c 'import json, sys; print(json.load(sys.stdin)["workspace_root"] and json.load if False else "")')"

      - name: Run Rust and conformance gates
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --workspace
          cargo build --locked --release --workspace
          ./target/release/lpp-conformance-runner --validate-only --fixtures conformance/fixtures/v1
          ./target/release/lpp-conformance-runner --provider ./target/release/lpp-mock-provider --fixtures conformance/fixtures/v1
