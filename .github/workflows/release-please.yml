name: Release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Maintain LPP release
    runs-on: ubuntu-latest
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GH_TOKEN }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          token: ${{ secrets.GH_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Synchronize Cargo.lock in the release PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          if [[ -z "${PR}" ]]; then
            echo 'No release-please PR requires Cargo.lock synchronization.'
            exit 0
          fi

          pr_number="$(jq -r '.number // empty' <<<"${PR}")"
          if [[ -z "${pr_number}" ]]; then
            echo 'release-please returned a PR without a number.' >&2
            exit 1
          fi

          gh pr checkout "${pr_number}"
          cargo metadata --format-version 1 --no-deps >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock is already synchronized.'
            exit 0
          fi
          git commit -m 'chore(release): synchronize Cargo.lock'
          git push
