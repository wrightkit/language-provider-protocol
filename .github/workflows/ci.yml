name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace
      - name: Build conformance binaries
        run: cargo build --locked --bin lpp-mock-provider --bin lpp-conformance-runner
      - name: Stage conformance binaries
        run: |
          mkdir -p target/conformance-artifact
          cp target/debug/lpp-mock-provider target/conformance-artifact/
          cp target/debug/lpp-conformance-runner target/conformance-artifact/
      - name: Upload conformance binaries
        uses: actions/upload-artifact@v7
        with:
          name: lpp-conformance-binaries
          path: target/conformance-artifact/
          if-no-files-found: error
          retention-days: 1

  conformance:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download conformance binaries
        uses: actions/download-artifact@v7
        with:
          name: lpp-conformance-binaries
          path: target/conformance-bin
      - name: Prepare conformance binaries
        run: chmod +x target/conformance-bin/lpp-mock-provider target/conformance-bin/lpp-conformance-runner
      - name: Validate fixture structure
        run: ./target/conformance-bin/lpp-conformance-runner --validate-only --fixtures conformance/fixtures/v1
      - name: Run conformance against the mock provider
        run: ./target/conformance-bin/lpp-conformance-runner --provider ./target/conformance-bin/lpp-mock-provider --fixtures conformance/fixtures/v1
