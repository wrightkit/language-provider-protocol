name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request supersedes the older run. Pushes to
# main never share a group, so each main commit keeps a complete run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skipped jobs still report their check names as passing, so a change that
  # touches only documentation does not leave a required check pending.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Check out repository
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
            workflows:
              - '.github/workflows/**'

  workflow-lint:
    name: Workflow lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: wrightkit/.github/.github/workflows/actionlint.yml@ci/speed-up

  rust:
    name: Rust (1.85.0)
    needs: changes
    uses: wrightkit/.github/.github/workflows/rust-quality.yml@ci/speed-up
    with:
      toolchain: 1.85.0
      all-targets: true
      cache-shared-key: linux-ci
      skip: ${{ needs.changes.outputs.code != 'true' }}

  conformance:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@ci/speed-up
        with:
          toolchain: 1.85.0
          cache-shared-key: linux-ci
      - name: Build runner and mock provider
        run: cargo build --locked --bin lpp-mock-provider --bin lpp-conformance-runner
      - name: Validate fixture structure
        run: ./target/debug/lpp-conformance-runner --validate-only --fixtures conformance/fixtures/v1
      - name: Run conformance against the mock provider
        run: ./target/debug/lpp-conformance-runner --provider ./target/debug/lpp-mock-provider --fixtures conformance/fixtures/v1
